name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Jobbby.sln

      - name: Build
        run: dotnet build Jobbby.sln --configuration Release --no-restore

      - name: Format
        run: dotnet format Jobbby.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Jobbby.sln --configuration Release --no-build --verbosity normal
